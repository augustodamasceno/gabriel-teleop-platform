name: AI Doc Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for accurate diff analysis
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        if command -v uv &> /dev/null; then
          echo "Using uv for package installation"
          uv pip install --system .
        else
          echo "uv not available, falling back to pip"
          python -m pip install --upgrade pip
          pip install -e .
        fi
    
    - name: Run AI documentation verification
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4' }}
      run: |
        python scripts/ai_doc_check.py
    
    - name: Comment on PR
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'AI Doc Check detected that documentation may need updates. Please review the workflow logs for details.'
          })
